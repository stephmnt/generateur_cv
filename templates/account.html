{% extends "base.html" %}
  {% block content %}
    <main>
      {% include "_nav.html" %}

      {% if notice %}
        <div class="notice">{{ notice }}</div>
      {% endif %}
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <section class="panel">
        <div class="section-head">
          <h2>Compte</h2>
        </div>
        <form action="{{ url_for('update_account_email') }}" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

          <label for="account_email">E-mail de connexion</label>
          <input id="account_email" name="email" type="email" value="{{ account.email }}" autocomplete="username" required>
          <div class="hint">Cet e-mail sert uniquement à la connexion. Il est indépendant de l'e-mail affiché dans le profil.</div>

          <div class="actions">
            <button type="submit">Enregistrer l'e-mail</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>Mot de passe</h2>
        </div>
        <form action="{{ url_for('update_account_password') }}" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

          <div class="grid">
            <div>
              <label for="current_password">Mot de passe actuel</label>
              <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
            </div>
            <div>
              <label for="new_password">Nouveau mot de passe</label>
              <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div>
              <label for="confirm_password">Confirmer le mot de passe</label>
              <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
            </div>
          </div>

          <div class="actions">
            <button type="submit">Modifier le mot de passe</button>
          </div>
        </form>
      </section>
    </main>
  {% endblock %}
