<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <title>Profil</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f5f7fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
        margin: 32px auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .header-icon {
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        object-fit: contain;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.2;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 19px;
      }

      h3 {
        font-size: 15px;
      }

      a {
        color: #1f2933;
        font-weight: 700;
        text-decoration: none;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
      }

      .nav-link {
        border-radius: 6px;
        padding: 9px 10px;
      }

      .nav-link.active {
        background: #e5e7eb;
      }

      .nav form {
        margin: 0;
      }

      .nav button {
        min-height: 38px;
        width: auto;
        padding: 0 14px;
      }

      .tabs {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 14px;
      }

      .tab-button {
        width: auto;
        min-height: 40px;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2933;
        padding: 0 14px;
        white-space: nowrap;
      }

      .tab-button.active {
        border-color: #1f2933;
        background: #1f2933;
        color: #ffffff;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.active {
        display: block;
      }

      .panel,
      .item-card,
      .add-card {
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
      }

      .panel {
        padding: 24px;
        margin-bottom: 18px;
      }

      .section-head,
      .item-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .item-list {
        display: grid;
        gap: 14px;
      }

      .item-card,
      .add-card {
        padding: 18px;
      }

      .add-card {
        margin-top: 18px;
      }

      .item-card.dragging {
        opacity: 0.55;
      }

      .drag-handle {
        width: auto;
        min-width: 38px;
        min-height: 34px;
        padding: 0 10px;
        background: #e5e7eb;
        color: #1f2933;
        cursor: grab;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .grid-compact {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .full {
        grid-column: 1 / -1;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 650;
      }

      input,
      textarea,
      button {
        width: 100%;
        border-radius: 6px;
        font: inherit;
        box-sizing: border-box;
      }

      input,
      textarea {
        border: 1px solid #bcccdc;
        background: #ffffff;
        color: #1f2933;
        padding: 11px 12px;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
      }

      button {
        min-height: 40px;
        border: 0;
        background: #1f2933;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      .button {
        min-height: 40px;
        border-radius: 6px;
        background: #1f2933;
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        box-sizing: border-box;
      }

      button:hover {
        background: #323f4b;
      }

      .button:hover {
        background: #323f4b;
      }

      .secondary {
        background: #e5e7eb;
        color: #1f2933;
      }

      .secondary:hover {
        background: #d1d5db;
      }

      .danger {
        background: #991b1b;
      }

      .danger:hover {
        background: #7f1d1d;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: flex-start;
        margin-top: 14px;
      }

      .actions form,
      .actions button,
      .actions .button {
        width: auto;
      }

      .actions button,
      .actions .button {
        min-width: 132px;
        padding: 0 14px;
      }

      .notice,
      .error {
        margin-bottom: 18px;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 700;
      }

      .notice {
        background: #ecfdf5;
        color: #166534;
      }

      .error {
        background: #fff1f2;
        color: #9f1239;
      }

      .hint,
      .usage-hint,
      .empty,
      .inline-status {
        color: #52606d;
        font-size: 13px;
        line-height: 1.45;
      }

      .hint,
      .usage-hint {
        margin-top: 6px;
      }

      .delete-warning {
        width: 100%;
        color: #92400e;
        font-size: 13px;
        line-height: 1.45;
      }

      .inline-status {
        min-height: 18px;
        margin: -6px 0 10px;
      }

      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 28px;
      }

      .checkbox input {
        width: auto;
      }

      .cv-row {
        margin: 20px 0;
      }

      .cv-row .meta,
      .cv-row .summary,
      .cv-row .actions {
        padding: 10px 0;
      }

      .selection-grid > div {
        margin-top: 20px;
      }

      .choice {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .choice input {
        flex: 0 0 auto;
        width: auto;
        margin-top: 2px;
      }

      .choice > span {
        min-width: 0;
      }

      @media (max-width: 760px) {
        .grid,
        .grid-compact {
          grid-template-columns: 1fr;
        }

        header,
        .nav,
        .brand,
        .actions,
        .section-head,
        .item-head {
          align-items: stretch;
          flex-direction: column;
        }

        .actions form,
        .actions button,
        .drag-handle {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    {% block content %}
    {% endblock %}
    {% block scripts %}
    {% endblock %}
  </body>
</html>
