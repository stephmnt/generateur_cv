<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f5f7fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
        line-height: 1.2;
      }

      label {
        display: block;
        margin: 16px 0 8px;
        font-size: 14px;
        font-weight: 650;
      }

      input,
      button {
        width: 100%;
        min-height: 44px;
        border-radius: 6px;
        font: inherit;
        box-sizing: border-box;
      }

      input {
        border: 1px solid #bcccdc;
        background: #ffffff;
        color: #1f2933;
        padding: 0 12px;
      }

      button {
        margin-top: 20px;
        border: 0;
        background: #1f2933;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #323f4b;
      }

      .error {
        margin-top: 18px;
        padding: 12px;
        border-radius: 6px;
        background: #fff1f2;
        color: #9f1239;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connexion</h1>

      <form method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" value="{{ default_email }}" autocomplete="username" required autofocus>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Se connecter</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
    </main>
  </body>
</html>
