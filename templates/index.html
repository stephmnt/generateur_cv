<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Générateur de CV</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2933;
        background: #f5f7fa;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 22px;
        line-height: 1.2;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 650;
      }

      select,
      button {
        width: 100%;
        min-height: 44px;
        border-radius: 6px;
        font: inherit;
      }

      select {
        border: 1px solid #bcccdc;
        background: #ffffff;
        color: #1f2933;
        padding: 0 12px;
      }

      button {
        margin-top: 16px;
        border: 0;
        background: #1f2933;
        color: #ffffff;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #323f4b;
      }

      .error {
        margin-top: 18px;
        padding: 12px;
        border-radius: 6px;
        background: #fff1f2;
        color: #9f1239;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.45;
        max-height: 260px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Générateur de CV</h1>

      <form action="{{ url_for('generate') }}" method="post">
        <label for="yaml_file">Fichier YAML</label>
        <select id="yaml_file" name="yaml_file" required>
          {% for path in yaml_files %}
            <option value="{{ path.name }}" {% if selected == path.name %}selected{% endif %}>
              {{ path.name }}
            </option>
          {% endfor %}
        </select>

        <button type="submit">Générer le PDF</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
    </main>
  </body>
</html>
